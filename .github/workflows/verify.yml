name: Verify
on: [push, pull_request]
jobs:
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: npm ci
      - run: npm test
      - run: npm run test:postgres
      - uses: denoland/setup-deno@v2
        with: { deno-version: v2.x }
      - run: deno check --config supabase/functions/deno.json supabase/functions/commerce/index.ts supabase/functions/invite-member/index.ts supabase/functions/sic-sync/index.ts supabase/functions/product-photos/index.ts
      - run: deno test --config supabase/functions/deno.json supabase/functions/_shared/environment_test.ts
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.47.1', channel: stable, cache: true }
      - run: flutter config --jdk-dir="$JAVA_HOME"
      - working-directory: mobile
        run: flutter pub get
      - working-directory: mobile
        run: flutter analyze
      - working-directory: mobile
        run: flutter test
      - working-directory: mobile
        run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: lineboard-android-debug
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.47.1', channel: stable, cache: true }
      - working-directory: mobile
        run: flutter pub get
      - working-directory: mobile
        run: flutter build ios --no-codesign
