<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><title>Acesso ao Lineboard</title></head>
<body style="font-family:Arial,sans-serif;color:#122c38;max-width:520px;margin:32px auto;padding:24px">
  <h1>Seu acesso ao Lineboard</h1>
  <p>Digite este código no aplicativo para entrar:</p>
  <p style="font-size:32px;letter-spacing:6px;font-weight:bold">{{ .Token }}</p>
  <p>Ou abra o link no celular em que o app está instalado:</p>
  <p><a href="{{ .ConfirmationURL }}">Entrar no Lineboard</a></p>
  <p>Se você não solicitou este acesso, ignore esta mensagem.</p>
</body>
</html>
