<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><title>Convite para o Lineboard</title></head>
<body style="font-family:Arial,sans-serif;color:#122c38;max-width:520px;margin:32px auto;padding:24px">
  <h1>Bem-vindo ao Lineboard</h1>
  <p>Seu acesso à loja está pronto. Digite este código na tela de entrada do aplicativo:</p>
  <p style="font-size:32px;letter-spacing:6px;font-weight:bold">{{ .Token }}</p>
  <p>Ou aceite o convite abrindo este link no celular:</p>
  <p><a href="{{ .ConfirmationURL }}">Aceitar convite</a></p>
  <p>Se você não reconhece este convite, ignore esta mensagem.</p>
</body>
</html>
